version: 1.4.{build}
image: Visual Studio 2022
install:
  - ps: |
      Invoke-WebRequest -Uri 'https://dot.net/v1/dotnet-install.ps1' -UseBasicParsing -OutFile "$env:temp\dotnet-install.ps1"
      & $env:temp\dotnet-install.ps1 -Architecture x64 -Version '10.0.100' -InstallDir "$env:ProgramFiles\dotnet"
configuration: Release
build_script:
  - dotnet build MIG.HomeAutomation.sln -c Release
test_script:
  - dotnet test MIG.HomeAutomation.Tests/MIG.HomeAutomation.Tests.csproj -c Release --no-build
after_test:
  - ps: .\MIG.HomeAutomation\nuget_pack.ps1
artifacts:
  - path: '*.nupkg'
    name: MIG nupkg
deploy:
  - provider: GitHub
    auth_token:
      secure: QJoBiqbeg1z+3WRoH1IdXRsnXtvwS95U2Z89JH9DrnEhJYMYbRpKjUmGEbOU3OnDLFz8gKqzP8y7KpL226lCb/Y+W6CTt7EGouenMIKnzZBllZVvSG73LdhHgD8RbxIy
    draft: false
    prerelease: false    
    on:
      appveyor_repo_tag: true
